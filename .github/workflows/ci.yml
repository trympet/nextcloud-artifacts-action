name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Node.js 24 / ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format-check

      - name: Lint
        run: npm run lint

      - name: Rebuild and test the action
        run: npm test

      - name: Check committed distribution
        shell: bash
        run: |
          untracked_files=$(git ls-files --others --exclude-standard -- dist)
          if ! git diff --quiet HEAD -- dist || [ -n "$untracked_files" ]; then
            git --no-pager diff --stat HEAD -- dist
            git status --short --untracked-files=all -- dist
            echo "::error::Run npm run package and commit all changes in dist/."
            exit 1
          fi
